<!doctype html>
<html lang="it">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no, maximum-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#131316" />
  <title>Burger Run | Ciccio's Burger</title>
  <meta name="description" content="Fai passare il tempo mentre il panino arriva: salta, scivola e componi il tuo burger." />
  <link rel="shortcut icon" type="image/x-icon" href="/img/icon_bg.ico" />
  <link rel="preload" href="/fonts/font_personalizzato.woff2" as="font" type="font/woff2" crossorigin="anonymous" />
  <link rel="preload" href="/gioco/ciccios_personaggio.png" as="image" />
  <link rel="stylesheet" href="/gioco/game.css?v=5" />
</head>

<body>
  <div class="app">
    <div class="topbar">
      <a class="back" href="/">&larr; Ciccio's Burger</a>
      <button class="icon-btn" id="muteBtn" type="button" aria-pressed="false" aria-label="Disattiva audio">
        <svg class="ico ico-on" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
          <path d="M4 9h3l4-3.5v13L7 15H4z" fill="currentColor" />
          <path d="M15 8.5a5 5 0 0 1 0 7M17.5 6a8 8 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
        </svg>
        <svg class="ico ico-off" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
          <path d="M4 9h3l4-3.5v13L7 15H4z" fill="currentColor" />
          <path d="M16 9.5l5 5m0-5l-5 5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
        </svg>
      </button>
    </div>

    <div class="intro">
      <h1>Burger Run</h1>
      <p>Il tempo passa pi&ugrave; in fretta mentre aspetti il panino. Salta, <strong>scivola</strong> sotto gli ostacoli appesi e raccogli gli ingredienti.</p>
    </div>

    <div class="stage" id="stage">
      <canvas id="game" role="img" aria-label="Gioco arcade: un hamburger salta e scivola fra gli ostacoli raccogliendo ingredienti"></canvas>

      <div class="hud" aria-hidden="true">
        <span class="score-wrap">
          <span class="score" id="score">00000</span>
          <span class="mult" id="mult"></span>
        </span>
        <span class="best" id="best">RECORD 00000</span>
      </div>

      <div class="banner" id="banner" aria-hidden="true"></div>

      <div class="powers" id="powers" aria-hidden="true"></div>
    </div>

    <!-- below the screen: the order being assembled, and what has been unlocked -->
    <div class="panel">
      <div class="statusbar" id="statusBar">
        <span class="label">PANINO</span>
        <span class="sep"></span>
        <span class="label" id="deliveries">CONSEGNE 0</span>
      </div>
      <div class="trophy-line">
        <span>TRAGUARDI <b id="trophyCount">0/0</b></span>
        <span class="sep"></span>
        <span class="tl-next" id="trophyNext">&mdash;</span>
      </div>
    </div>

    <!-- controls live below the screen, like the body of a handheld -->
    <div class="pad">
      <div class="pad-slot">
        <button class="pad-btn" id="slideBtn" type="button" aria-label="Scivola sotto l'ostacolo">
          <svg viewBox="0 0 24 24" width="28" height="28" aria-hidden="true">
            <path d="M6 9l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        </button>
        <span class="pad-label">SCIVOLA</span>
      </div>
      <div class="pad-slot">
        <button class="pad-btn pad-btn-main" id="jumpBtn" type="button" aria-label="Salta">
          <svg viewBox="0 0 24 24" width="28" height="28" aria-hidden="true">
            <path d="M6 15l6-6 6 6" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        </button>
        <span class="pad-label">SALTA</span>
      </div>
    </div>

    <p class="foot">Un piccolo esperimento di <a href="/">Ciccio's Burger</a></p>
  </div>

  <!-- full screen, outside the play box: on game over there is far more to show
       than a 226px playfield can hold -->
  <div class="overlay" id="overlay">
    <h2 id="ovTitle">Burger Run</h2>
    <p id="ovText"></p>
    <div class="ov-lists">
      <div class="missions" id="ovMissions" hidden></div>
      <div class="trophies" id="ovTrophies" hidden></div>
    </div>
    <button class="btn" id="ovBtn" type="button">Gioca</button>
  </div>

  <script src="/gioco/game.js?v=5"></script>
</body>

</html>
